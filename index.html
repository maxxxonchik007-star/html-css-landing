<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DJI Mini 3 Pro Landing</title>
  <!-- Подключение шрифта Montserrat из Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="card-wrapper">
    <!-- Шапка страницы -->
    <header class="header">
      <div class="logo">DGB</div>
      
      <nav class="nav">
        <a href="#" class="nav-link">HOME</a>
        <a href="#" class="nav-link">ABOUT US</a>
        <a href="#" class="nav-link">PRODUCT</a>
        <a href="#" class="nav-link">CONTACTS</a>
      </nav>

      <div class="cart-icon">
        <!-- SVG-иконка корзины/сумки -->
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>
    </header>

    <!-- Основной блок с контентом -->
    <main class="hero">
      <!-- Фоновая надпись DRONE -->
      <h1 class="big-title">DRONE</h1>

      <!-- Изображение дрона -->
      <div class="drone-box">
        <img src="https://pngimg.com/d/drone_PNG57.png" alt="DJI Mini 3 Pro Drone" class="drone-image">
      </div>

      <!-- Текстовое описание и кнопка -->
      <div class="hero-info">
        <h2 class="product-title">DJI MINI 3 PRO</h2>
        <p class="product-desc">
          Lorem Ipsum is simply dummy text of the printing and typesetting industry. Lorem Ipsum
        </p>
        <button class="buy-btn">BUY NOW</button>
      </div>

      <!-- Правая вертикальная панель/слайдер -->
      <div class="side-control">
        <span class="side-text">SLIDE</span>
        <div class="side-indicator">
          <span class="dot"></span>
        </div>
        <span class="side-text">TAP TO PLAY</span>
      </div>
    </main>
  </div>

</body>
</html>
